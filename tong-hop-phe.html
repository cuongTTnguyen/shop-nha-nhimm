<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Hợp Phe - Shop Nhà Nhimm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header id="global-header" class="index-header"></header>
    <div id="search-bar-container" class="search-bar-hidden">
        <input type="text" id="faction-search-input" placeholder="Tìm kiếm phe..." onkeyup="window.timKiemPhe()">
        <button type="button" onclick="window.timKiemPhe()">Tìm</button>
    </div>

    <!-- SIDEBAR -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebarMenu()"></div>

    <div id="left-sidebar" class="left-sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">MENU</span>
            <button class="close-sidebar" onclick="toggleSidebarMenu()">&times;</button>
        </div>
        
        <ul class="sidebar-nav">
            <li><a href="index.html">🏠 Menu chính</a></li>
            <li class="has-submenu">
                <div class="submenu-header" onclick="toggleSubmenu(this)">
                    📜 Luật chơi <span class="arrow">▼</span>
                </div>
                <ul class="submenu">
                    <li><a href="luat-choi-root.html">· Luật chơi ROOT</a></li>
                    <li><a href="luat-choi-fort.html">· Luật chơi Fort</a></li>
                    <li><a href="luat-choi-arcs.html">· Luật chơi Arcs</a></li>
                </ul>
            </li>
            <li><a href="san-pham.html">🛒 Tiếp tục mua sắm</a></li>
            <li><a href="thong-tin.html">ℹ️ Thông tin bổ sung</a></li>
            <li><a href="ung-ho.html">🎁 Donate</a></li>
        </ul>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <h2 style="text-align: center; margin-top: 50px;">DANH SÁCH PHE PHÁI</h2>
    
    <div class="legend-container">
        <div class="legend-item">
            <span class="price-label real">Gốc</span> 
            <span class="legend-text">Các phe được tạo ra từ Nhà Phát Hành.</span>
        </div>
        <div class="legend-item">
            <span class="price-label fake">Fanmade</span> 
            <span class="legend-text">Các phe được tạo ra từ fan.</span>
        </div>
    </div>

    <div class="filter-container">
        <button class="filter-btn active" onclick="window.locSanPham('tat-ca')">Tất cả</button>
        <button class="filter-btn" onclick="window.locSanPham('Goc')">Phe chính gốc</button>
        <button class="filter-btn" onclick="window.locSanPham('Fanmade')">Phe Fanmade</button>
    </div>

    <div id="product-grid" class="container"></div>

    <footer id="global-footer" class="main-footer"></footer>

    <script src="script.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApRi3KOcuCyN_RH9gNl2g17f03_D5t_l0",
            authDomain: "rootvn-3eeca.firebaseapp.com",
            projectId: "rootvn-3eeca",
            storageBucket: "rootvn-3eeca.firebasestorage.app",
            messagingSenderId: "92355209659",
            appId: "1:92355209659:web:0ed0e8a38118e86ea63c9e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.danhSachPhe = [];

        window.hienThiPhe = function(tagCanLoc = 'tat-ca') {
            const container = document.getElementById('product-grid');
            if (!container) return;

            // Bộ lọc an toàn tránh sập code nếu thiếu tags
            const danhSachDaLoc = tagCanLoc === 'tat-ca' 
                ? window.danhSachPhe 
                : window.danhSachPhe.filter(phe => phe.tags && Array.isArray(phe.tags) && phe.tags.includes(tagCanLoc));

            if (danhSachDaLoc.length === 0) {
                container.innerHTML = "<p style='text-align:center; width:100%; color:#666;'>Chưa có phe phái nào trong danh mục này.</p>";
                return;
            }

            let htmlContent = "";
            danhSachDaLoc.forEach((phe) => {
                let isGoc = phe.tags && Array.isArray(phe.tags) && phe.tags.includes("Goc");
                let tagClass = isGoc ? "real" : "fake";
                let displayTagName = isGoc ? "Gốc" : "Fanmade";

                htmlContent += `
                    <div class="product-card">
                        <img src="${phe.anh || 'https://placehold.co/400x300?text=No+Image'}" alt="${phe.ten || 'Không tên'}" onclick="window.xemChiTietPhe('${(phe.ten || '').replace(/'/g, "\\'")}')" 
                             onerror="this.src='https://placehold.co/400x300?text=No+Image'" style="cursor:pointer">
                        <div class="product-info">
                            <div class="tag-container">
                                <span class="price-label ${tagClass}">${displayTagName}</span>
                            </div>
                            <h3 onclick="window.xemChiTietPhe('${(phe.ten || '').replace(/'/g, "\\'")}')" style="cursor:pointer; margin: 10px 0;">${phe.ten || 'Chưa đặt tên'}</h3>
                            
                            <div style="font-size: 13px; color: #666; margin-bottom: 5px;">
                                <i class="fas fa-hammer"></i> <strong>Tạo bởi:</strong> ${phe.taoBoi || 'Đang cập nhật'}
                            </div>
                            <div style="font-size: 13px; color: #666; margin-bottom: 15px;">
                                <i class="fas fa-paint-brush"></i> <strong>Minh họa:</strong> ${phe.minhHoa || 'Đang cập nhật'}
                            </div>

                            <button class="btn-buy" style="background-color: #4a6741; border:none; color:white; width:100%; padding:10px; border-radius:8px; cursor:pointer;" 
                                    onclick="window.xemChiTietPhe('${(phe.ten || '').replace(/'/g, "\\'")}')">
                                Xem chi tiết phe
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = htmlContent;
        };

        // ĐỊNH NGHĨA HÀM CHUYỂN TRANG 
        window.xemChiTietPhe = function(tenPhe) {
            window.location.href = `phe-chi-tiet.html?name=${encodeURIComponent(tenPhe)}`;
        };

        // ĐỊNH NGHĨA HÀM LỌC SẢN PHẨM 
        window.locSanPham = function(tag) { 
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (tag === 'tat-ca' && btn.innerText.includes('Tất cả')) btn.classList.add('active');
                if (tag === 'Goc' && btn.innerText.includes('Gốc')) btn.classList.add('active');
                if (tag === 'Fanmade' && btn.innerText.includes('Fanmade')) btn.classList.add('active');
            });
            window.hienThiPhe(tag);
        };

        // ĐỊNH NGHĨA HÀM TÌM KIẾM
        window.timKiemPhe = function() {
            const inputElement = document.getElementById('faction-search-input');
            if(!inputElement) return;
            
            const input = inputElement.value.toLowerCase();
            const container = document.getElementById('product-grid');
            if (!container) return;

            const filtered = window.danhSachPhe.filter(phe => 
                (phe.ten && phe.ten.toLowerCase().includes(input)) || 
                (phe.moTa && phe.moTa.toLowerCase().includes(input)) ||
                (phe.taoBoi && phe.taoBoi.toLowerCase().includes(input))
            );
            
            if (filtered.length === 0) {
                container.innerHTML = "<p style='text-align:center; width:100%;'>Không tìm thấy phe nào phù hợp.</p>";
                return;
            }

            let htmlContent = "";
            filtered.forEach((phe) => {
                let isGoc = phe.tags && Array.isArray(phe.tags) && phe.tags.includes("Goc");
                let tagClass = isGoc ? "real" : "fake";
                htmlContent += `
                    <div class="product-card">
                        <img src="${phe.anh || 'https://placehold.co/400x300?text=No+Image'}" alt="${phe.ten || 'Không tên'}" onclick="window.xemChiTietPhe('${(phe.ten || '').replace(/'/g, "\\'")}')" style="cursor:pointer" onerror="this.src='https://placehold.co/400x300?text=No+Image'">
                        <div class="product-info">
                            <span class="price-label ${tagClass}">${isGoc ? 'Gốc' : 'Fanmade'}</span>
                            <h3 onclick="window.xemChiTietPhe('${(phe.ten || '').replace(/'/g, "\\'")}')" style="cursor:pointer; margin-top:10px;">${phe.ten || 'Chưa đặt tên'}</h3>
                            <div style="font-size: 12px; color:#666;"><i class="fas fa-hammer"></i> ${phe.taoBoi || 'Đang cập nhật'}</div>
                            <button class="btn-buy" style="margin-top: 15px; background:#4a6741; color:white; border:none; padding:8px; border-radius:5px; width:100%; cursor:pointer;" onclick="window.xemChiTietPhe('${(phe.ten || '').replace(/'/g, "\\'")}')">Xem chi tiết</button>
                        </div>
                    </div>`;
            });
            container.innerHTML = htmlContent;
        };

        // TỰ ĐỘNG TẢI DỮ LIỆU KHI MỞ TRANG
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('product-grid');
            if (container) {
                container.innerHTML = "<div style='text-align:center; width:100%; padding:40px;'><i class='fas fa-spinner fa-spin' style='font-size: 30px; color: #4a6741;'></i><p style='margin-top:15px; color:#4a6741; font-weight:bold;'>Đang tải dữ liệu từ máy chủ Woodland...</p></div>";
                try {
                    const querySnapshot = await getDocs(collection(db, "phe-phai"));
                    window.danhSachPhe = [];
                    querySnapshot.forEach((doc) => {
                        window.danhSachPhe.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sắp xếp danh sách phe theo tên ABC cho đẹp
                    window.danhSachPhe.sort((a, b) => (a.ten || '').localeCompare(b.ten || ''));
                    
                    window.hienThiPhe('tat-ca');
                } catch (error) {
                    console.error("Lỗi lấy dữ liệu:", error);
                    container.innerHTML = "<p style='text-align:center; width:100%; color:red;'>Lỗi tải dữ liệu. Bạn hãy đưa code lên GitHub hoặc dùng Live Server để xem nhé!</p>";
                }
            }
        });
    </script>
    <script type="module" src="auth-helper.js"></script>
    <script src="layout-helper.js"></script>
</body>
</html>
