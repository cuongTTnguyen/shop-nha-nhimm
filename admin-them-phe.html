<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Phe Phái - Nhà Nhimm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #f4f1ea; }
        .admin-wrapper { display: flex; min-height: 100vh; }
        .admin-main { flex: 1; margin-left: 250px; padding: 30px; }
        
        .admin-container { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e0d9c5; margin-bottom: 40px; }
        .admin-title { color: #4a6741; text-align: center; margin-bottom: 20px; }
        
        /* Chia section cho form */
        .form-section { background: #fdfaf3; border: 1px dashed #4a6741; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .form-section h3 { color: #4a6741; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #e0d9c5; padding-bottom: 10px; font-size: 16px;}
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; color: #333; margin-bottom: 8px; font-size: 13px; }
        .form-group input[type="text"], .form-group input[type="number"], .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
        .form-group textarea { resize: vertical; height: 80px; }
        
        .stat-input-group { display: flex; gap: 10px; }
        .stat-input-group input[type="number"] { flex: 1; }
        .stat-input-group input[type="text"] { flex: 2; }

        .btn-submit { width: 100%; padding: 15px; background: #4a6741; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn-submit:hover { background: #ff4757; }
        .action-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .btn-reset { width: 100%; padding: 15px; background: #f1f2f6; color: #555; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-reset:hover { background: #dfe4ea; color: #ff4757; }
        #status-message { text-align: center; margin-top: 15px; font-weight: bold; }
        
        .list-section-title { color: #2c3e50; margin: 40px 0 20px 0; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        .item-list-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .manage-item-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: center; border: 1px solid #eee; position: relative;}
        .manage-item-card img { width: 70px; height: 70px; object-fit: contain; border-radius: 5px; background: #f9f9f9; }
        .manage-item-info { flex: 1; }
        .manage-item-name { font-weight: bold; color: #333; margin-bottom: 5px; }
        .manage-item-actions { display: flex; flex-direction: column; gap: 5px; }
        .btn-mini { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; transition: 0.3s;}
        
        .btn-edit-mini { background: #3498db; }
        .btn-delete-mini { background: #e74c3c; }
        .btn-approve-mini { background: #27ae60; }
        .btn-approve-mini:hover { background: #2ecc71; }
        
        .badge-pending { position: absolute; top: -10px; right: -10px; background: #e67e22; color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}

        @media (max-width: 768px) { .admin-main { margin-left: 60px; padding: 15px; } .form-row, .item-list-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div id="global-admin-sidebar"></div>

        <main class="admin-main" id="admin-main-content" style="display:none;">
            
            <!-- DANH SÁCH CHỜ DUYỆT -->
            <h2 class="list-section-title" style="color:#d35400; border-color:#d35400; margin-top:0;"><i class="fas fa-inbox"></i> PHE DO NGƯỜI CHƠI ĐÓNG GÓP (CHỜ DUYỆT)</h2>
            <div class="item-list-container" id="pending-list" style="margin-bottom: 40px;">
                <!-- Dữ liệu chờ duyệt -->
            </div>

            <!-- FORM KHAI BÁO -->
            <div class="admin-container">
                <h2 class="admin-title" id="form-title"><i class="fas fa-paw"></i> KHAI BÁO CHI TIẾT PHE PHÁI</h2>
                
                <!-- SECTION 1: THÔNG TIN CƠ BẢN -->
                <div class="form-section">
                    <h3>1. THÔNG TIN CƠ BẢN</h3>
                    <div class="form-row">
                        <div class="form-group"><label>Tên Phe (Tiếng Việt)</label><input type="text" id="phe-name" placeholder="VD: Nữ Bá Tước Mèo"></div>
                        <div class="form-group"><label>Tên Gốc (Tiếng Anh)</label><input type="text" id="phe-eng" placeholder="VD: Marquise de Cat"></div>
                    </div>
                    
                    <div class="form-group"><label>Slogan / Câu trích dẫn</label><input type="text" id="phe-slogan" placeholder="VD: Bạn đã chinh phục được khu rừng..."></div>

                    <div class="form-row">
                        <div class="form-group"><label>Tạo bởi (Tác giả)</label><input type="text" id="phe-author" placeholder="VD: Cole Wehrle"></div>
                        <div class="form-group"><label>Họa sĩ minh họa</label><input type="text" id="phe-artist" placeholder="VD: Kyle Ferrin"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Trạng thái (Badge)</label>
                            <select id="phe-status"><option value="Cân bằng">Cân bằng</option><option value="Testing">Testing</option><option value="Đang Test">Đang Test</option><option value="Hoàn thành">Hoàn thành</option></select>
                        </div>
                        <div class="form-group">
                            <label>Phân loại (Gốc hay Fanmade)</label>
                            <select id="phe-tag"><option value="Goc">Phe Gốc</option><option value="Fanmade">Phe Fanmade</option></select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group"><label>Link Ảnh Icon Phe (Vuông)</label><input type="text" id="phe-icon"></div>
                        <div class="form-group"><label>Thứ tự hiển thị</label><input type="number" id="phe-order" value="100"></div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> Màu chủ đạo</label>
                        <input type="color" id="phe-color" value="#e67e22" style="height: 42px; cursor: pointer; padding: 2px; width: 100%; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                </div>

                <!-- SECTION 2: CHỈ SỐ GAMEPLAY -->
                <div class="form-section">
                    <h3>2. CHỈ SỐ GAMEPLAY</h3>
                    <div class="form-row">
                        <div class="form-group"><label>Loại phe</label><input type="text" id="phe-type" placeholder="VD: Phe thiện chiến"></div>
                        <div class="form-group"><label>Tầm ảnh hưởng (Reach)</label><input type="number" id="phe-reach" placeholder="VD: 10"></div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Độ phức tạp</label>
                            <div class="stat-input-group"><input type="text" id="stat-comp-pc" placeholder="%"><input type="text" id="stat-comp-txt" placeholder="Chữ hiển thị"></div>
                        </div>
                        <div class="form-group">
                            <label>Số lượng lá bài</label>
                            <div class="stat-input-group"><input type="text" id="stat-card-pc" placeholder="%"><input type="text" id="stat-card-txt" placeholder="Chữ hiển thị"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Độ hiếu chiến</label>
                            <div class="stat-input-group"><input type="text" id="stat-aggr-pc" placeholder="%"><input type="text" id="stat-aggr-txt" placeholder="Chữ hiển thị"></div>
                        </div>
                        <div class="form-group">
                            <label>Khả năng chế tạo</label>
                            <div class="stat-input-group"><input type="text" id="stat-craft-pc" placeholder="%"><input type="text" id="stat-craft-txt" placeholder="Chữ hiển thị"></div>
                        </div>
                    </div>
                </div>

                <!-- SECTION 3: HÌNH ẢNH & THÔNG TIN EXTRA -->
                <div class="form-section">
                    <h3>3. THƯ VIỆN HÌNH ẢNH & EXTRA</h3>
                    <div class="form-group"><label>Link Ảnh Bảng Mặt Trước</label><input type="text" id="img-front"></div>
                    <div class="form-group"><label>Link Ảnh Bảng Mặt Sau</label><input type="text" id="img-back"></div>
                    <div class="form-row">
                        <div class="form-group"><label>Link Ảnh Lá Bài</label><input type="text" id="img-cards"></div>
                        <div class="form-group"><label>Link Ảnh Setup Nâng cao (Adset)</label><input type="text" id="img-adset"></div>
                    </div>
                    
                    <div class="form-group" style="margin-top:15px;"><label style="color:#d35400;">Link Tải Tài Nguyên (Từ người dùng)</label><input type="text" id="link-tai-nguyen" placeholder="Trống..."></div>
                    <div class="form-group"><label>Cốt truyện / Mô tả chi tiết</label><textarea id="phe-desc"></textarea></div>
                </div>

                <div class="action-buttons">
                    <button class="btn-submit" id="btn-save" style="flex: 2;">LƯU PHE PHÁI NÀY</button>
                    <button class="btn-reset" id="btn-clear" style="flex: 1;">HUỶ / LÀM MỚI</button>
                </div>
                <div id="status-message"></div>
            </div>

            <h2 class="list-section-title"><i class="fas fa-list"></i> DANH SÁCH PHE ĐÃ DUYỆT (CHÍNH THỨC)</h2>
            <div class="item-list-container" id="manage-list"></div>
        </main>
    </div>

    <script src="admin-layout-helper.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApRi3KOcuCyN_RH9gNl2g17f03_D5t_l0",
            authDomain: "rootvn-3eeca.firebaseapp.com",
            projectId: "rootvn-3eeca",
            storageBucket: "rootvn-3eeca.firebasestorage.app",
            messagingSenderId: "92355209659",
            appId: "1:92355209659:web:0ed0e8a38118e86ea63c9e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let dangSuaId = null;
        let isPendingMode = null; // Cờ kiểm tra xem form đang dùng để sửa hay duyệt
        let danhSachLocal = [];
        let danhSachPending = [];

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "cuong23022003@gmail.com") {
                document.getElementById('admin-main-content').style.display = 'block';
                loadPendingItems();
                loadItems();
            } else {
                document.body.innerHTML = `<div style="text-align:center; padding:100px; font-family:sans-serif;"><i class="fas fa-lock" style="font-size:50px; color:#e74c3c;"></i><h2>Truy cập bị từ chối!</h2></div>`;
            }
        });

        // 1. TẢI DANH SÁCH CHỜ DUYỆT
        async function loadPendingItems() {
            const container = document.getElementById('pending-list');
            try {
                const snapshot = await getDocs(collection(db, "phe-cho-duyet"));
                danhSachPending = [];
                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    danhSachPending.push({ id: doc.id, ...data });
                    html += `
                        <div class="manage-item-card" style="border-color:#e67e22; background:#fffcf9;">
                            <div class="badge-pending">Chờ duyệt</div>
                            <img src="${data.anh}" onerror="this.src='https://placehold.co/70x70?text=NO+IMG'">
                            <div class="manage-item-info">
                                <div class="manage-item-name">${data.ten}</div>
                                <div style="font-size:12px; color:#666;">Người gửi: ${data.nguoiGuiEmail || 'Ẩn danh'}</div>
                            </div>
                            <div class="manage-item-actions">
                                <button class="btn-mini btn-approve-mini" onclick="window.viewPending('${doc.id}')"><i class="fas fa-search"></i> Chi tiết & Duyệt</button>
                                <button class="btn-mini btn-delete-mini" onclick="window.confirmDeletePending(this, '${doc.id}')"><i class="fas fa-times"></i> Xóa</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || "<p style='color:#888; font-style:italic;'>Không có phe nào đang chờ duyệt.</p>";
            } catch(e) { container.innerHTML = "Lỗi: " + e.message; }
        }

        // 2. TẢI DANH SÁCH CHÍNH THỨC
        async function loadItems() {
            const container = document.getElementById('manage-list');
            try {
                const snapshot = await getDocs(collection(db, "phe-phai"));
                danhSachLocal = [];
                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    danhSachLocal.push({ id: doc.id, ...data });
                    html += `
                        <div class="manage-item-card">
                            <img src="${data.anh}" onerror="this.src='https://placehold.co/70x70?text=NO+IMG'">
                            <div class="manage-item-info">
                                <div class="manage-item-name">${data.ten}</div>
                                <div style="font-size:12px; color:#666;">Thứ tự: ${data.thuTu !== undefined ? data.thuTu : 'Chưa set'} | Tác giả: ${data.taoBoi || 'Chưa rõ'}</div>
                            </div>
                            <div class="manage-item-actions">
                                <button class="btn-mini btn-edit-mini" onclick="window.prepareEdit('${doc.id}')">Sửa</button>
                                <button class="btn-mini btn-delete-mini" onclick="window.confirmDelete(this, '${doc.id}')">Xóa</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || "Chưa có dữ liệu.";
            } catch(e) { container.innerHTML = "Lỗi: " + e.message; }
        }

        // 3. ĐẨY DỮ LIỆU CHỜ LÊN FORM ĐỂ ADMIN XEM & DUYỆT
        window.viewPending = function(id) {
            const item = danhSachPending.find(x => x.id === id);
            if(!item) return;
            
            dangSuaId = null;
            isPendingMode = id; // Đánh dấu là đang ở chế độ duyệt
            
            document.getElementById('form-title').innerHTML = `<i class="fas fa-check-circle"></i> ĐANG XEM XÉT DUYỆT: ${item.ten}`;
            document.getElementById('form-title').style.color = "#d35400";
            
            const btnSave = document.getElementById('btn-save');
            btnSave.innerHTML = "<i class='fas fa-check'></i> DUYỆT & ĐĂNG PHE NÀY LÊN";
            btnSave.style.background = "#d35400";

            fillFormWithData(item);
            window.scrollTo({ top: 500, behavior: 'smooth' });
        };

        // 4. CHẾ ĐỘ SỬA BÌNH THƯỜNG
        window.prepareEdit = function(id) {
            const item = danhSachLocal.find(x => x.id === id);
            if(!item) return;
            
            dangSuaId = id;
            isPendingMode = null;
            
            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit"></i> ĐANG SỬA PHE: ${item.ten}`;
            document.getElementById('form-title').style.color = "#4a6741";
            
            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "CẬP NHẬT PHE PHÁI";
            btnSave.style.background = "#4a6741";

            fillFormWithData(item);
            window.scrollTo({ top: 500, behavior: 'smooth' });
        };

        function fillFormWithData(item) {
            const safeSet = (id, val) => { const el = document.getElementById(id); if (el) el.value = (val !== undefined && val !== null) ? val : ''; };

            safeSet('phe-name', item.ten);
            safeSet('phe-eng', item.tenGoc);
            safeSet('phe-slogan', item.slogan);
            safeSet('phe-author', item.taoBoi);
            safeSet('phe-artist', item.minhHoa);
            safeSet('phe-status', item.trangThai || 'Cân bằng');
            safeSet('phe-tag', (item.tags && item.tags.length > 0) ? item.tags[0] : 'Goc');
            safeSet('phe-icon', item.anh);
            safeSet('phe-order', item.thuTu !== undefined ? item.thuTu : 100);
            document.getElementById('phe-color').value = item.mauChuDao || '#e67e22';
            
            safeSet('phe-type', item.loaiPhe);
            safeSet('phe-reach', item.tamAnhHuong);
            safeSet('stat-comp-pc', item.statCompPc);
            safeSet('stat-comp-txt', item.statCompTxt);
            safeSet('stat-card-pc', item.statCardPc);
            safeSet('stat-card-txt', item.statCardTxt);
            safeSet('stat-aggr-pc', item.statAggrPc);
            safeSet('stat-aggr-txt', item.statAggrTxt);
            safeSet('stat-craft-pc', item.statCraftPc);
            safeSet('stat-craft-txt', item.statCraftTxt);

            safeSet('img-front', item.imgFront);
            safeSet('img-back', item.imgBack);
            safeSet('img-cards', item.imgCards);
            safeSet('img-adset', item.imgAdset);
            safeSet('phe-desc', item.moTa);
            safeSet('link-tai-nguyen', item.linkTai);
        }

        // 5. XÓA BẢN NHÁP (TỪ CHỐI)
        window.confirmDeletePending = async function(btn, id) {
            if(confirm("Bạn có chắc chắn muốn TỪ CHỐI và XÓA bản nháp này không?")) {
                btn.innerText = "...";
                try { await deleteDoc(doc(db, "phe-cho-duyet", id)); loadPendingItems(); } catch(e) { alert("Lỗi"); }
            }
        };

        window.confirmDelete = async function(btn, id) {
            if(confirm("Xóa vĩnh viễn phe phái chính thức này khỏi hệ thống?")) {
                btn.innerText = "...";
                try { await deleteDoc(doc(db, "phe-phai", id)); loadItems(); } catch(e) { alert("Lỗi"); }
            }
        };

        document.getElementById('btn-clear').addEventListener('click', resetForm);

        function resetForm() {
            dangSuaId = null;
            isPendingMode = null;
            document.getElementById('form-title').innerHTML = `<i class="fas fa-paw"></i> KHAI BÁO CHI TIẾT PHE PHÁI`;
            document.getElementById('form-title').style.color = "#4a6741";
            
            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "LƯU PHE PHÁI NÀY";
            btnSave.style.background = "#4a6741";
            
            document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => el.value = '');
            document.getElementById('phe-status').value = 'Cân bằng';
            document.getElementById('phe-tag').value = 'Goc';
            document.getElementById('phe-order').value = '100';
            document.getElementById('phe-color').value = '#e67e22';
        }

        document.getElementById('btn-save').addEventListener('click', async () => {
            const btn = document.getElementById('btn-save');
            const statusMsg = document.getElementById('status-message');
            
            const ten = document.getElementById('phe-name').value.trim();
            const anh = document.getElementById('phe-icon').value.trim();

            if(!ten || !anh) { statusMsg.style.color = "#ff4757"; statusMsg.innerText = "Tên phe và Ảnh Icon là bắt buộc!"; return; }

            const thuTuInput = parseInt(document.getElementById('phe-order').value);
            const data = { 
                ten: ten, tenGoc: document.getElementById('phe-eng').value.trim(), slogan: document.getElementById('phe-slogan').value.trim(),
                taoBoi: document.getElementById('phe-author').value.trim(), minhHoa: document.getElementById('phe-artist').value.trim(),
                trangThai: document.getElementById('phe-status').value, tags: [document.getElementById('phe-tag').value],
                anh: anh, thuTu: isNaN(thuTuInput) ? 100 : thuTuInput, mauChuDao: document.getElementById('phe-color').value, 
                loaiPhe: document.getElementById('phe-type').value.trim(), tamAnhHuong: parseInt(document.getElementById('phe-reach').value) || 0,
                statCompPc: document.getElementById('stat-comp-pc').value.trim(), statCompTxt: document.getElementById('stat-comp-txt').value.trim(),
                statCardPc: document.getElementById('stat-card-pc').value.trim(), statCardTxt: document.getElementById('stat-card-txt').value.trim(),
                statAggrPc: document.getElementById('stat-aggr-pc').value.trim(), statAggrTxt: document.getElementById('stat-aggr-txt').value.trim(),
                statCraftPc: document.getElementById('stat-craft-pc').value.trim(), statCraftTxt: document.getElementById('stat-craft-txt').value.trim(),
                imgFront: document.getElementById('img-front').value.trim(), imgBack: document.getElementById('img-back').value.trim(),
                imgCards: document.getElementById('img-cards').value.trim(), imgAdset: document.getElementById('img-adset').value.trim(),
                linkTai: document.getElementById('link-tai-nguyen').value.trim(), moTa: document.getElementById('phe-desc').value.trim() 
            };

            btn.innerText = "ĐANG XỬ LÝ...";
            try {
                if (isPendingMode) {
                    // Nếu đang Duyệt -> Lưu vào bảng chính, XÓA ở bảng chờ
                    await addDoc(collection(db, "phe-phai"), data);
                    await deleteDoc(doc(db, "phe-cho-duyet", isPendingMode));
                    statusMsg.style.color = "#27ae60"; statusMsg.innerText = "Đã duyệt và đăng thành công!";
                    loadPendingItems();
                } 
                else if (dangSuaId) {
                    // Cập nhật bình thường
                    await updateDoc(doc(db, "phe-phai", dangSuaId), data);
                    statusMsg.style.color = "#27ae60"; statusMsg.innerText = "Cập nhật thành công!";
                } 
                else {
                    // Thêm mới hoàn toàn
                    await addDoc(collection(db, "phe-phai"), data);
                    statusMsg.style.color = "#27ae60"; statusMsg.innerText = "Thêm thành công!";
                }
                
                resetForm(); loadItems();
            } catch(e) {
                statusMsg.style.color = "#ff4757"; statusMsg.innerText = "Lỗi: " + e.message;
            }
        });
    </script>
</body>
</html>
